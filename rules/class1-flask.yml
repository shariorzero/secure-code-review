rules:
  - id: class1-eval-exec
    languages: [python]
    severity: ERROR
    message: eval()/exec() ব্যবহার করা হয়েছে। ইউজার ইনপুট এখানে পৌঁছালে Remote Code Execution সম্ভব।
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: class1-flask-debug-true
    languages: [python]
    severity: ERROR
    message: debug=True প্রোডাকশনে Werkzeug debugger এক্সপোজ করে।
    pattern: $APP.run(..., debug=True, ...)

  - id: class1-hardcoded-secret-key
    languages: [python]
    severity: ERROR
    message: secret_key সোর্স কোডে হার্ডকোড করা। এনভায়রনমেন্ট/সিক্রেট ম্যানেজার ব্যবহার করুন।
    pattern: $APP.secret_key = "..."

  - id: class1-insecure-cookie-flag
    languages: [python]
    severity: WARNING
    message: সেশন কুকির সিকিউরিটি ফ্ল্যাগ বন্ধ করা হয়েছে।
    pattern-either:
      - pattern: SESSION_COOKIE_HTTPONLY=False
      - pattern: SESSION_COOKIE_SECURE=False
